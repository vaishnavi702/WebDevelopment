<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Temperature Converter🌡️</h1>
        <label for="temperature">Temperature:</label>
        <input type="number" id="temperature" placeholder="Enter Temperature...">
        
        <select id="inunit">
            <option value="°C">From °C</option>
            <option value="°F">From °F</option>
        </select>
		<select id="outunit">
            <option value="°C">To °C</option>
            <option value="°F">To °F</option>
        </select>
        
        <button onclick="convertTemperature()">Calculate</button>
        
        <h2 id="result"></h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
